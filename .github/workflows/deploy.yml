name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the workflow every time you push to main

permissions:
  contents: write # Crucial: Allows the action to commit build files to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Faster and cleaner install than 'npm install' for CI environments

      - name: Build project
        run: npm run build # Compiles your application

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Change to 'build' if your framework outputs to a 'build' folder instead of 'dist'
          branch: gh-pages # The branch the action will deploy the production files to